name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-only-auth-secret-not-for-production
  AUTH_GOOGLE_ID: ci-google-client
  AUTH_GOOGLE_SECRET: ci-google-secret

jobs:
  fast-gate:
    name: Workflow, types, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor
      - run: pnpm verify:fast

  acceptance-gate:
    name: Build and critical browser smoke
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  release-acceptance:
    name: Complete targeted release acceptance
    if: github.event_name == 'workflow_dispatch'
    needs: acceptance-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:targeted
      - name: Upload targeted acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-acceptance-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
