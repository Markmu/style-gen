const state={phase:'ready',view:'reference',panel:'evidence',version:1,subject:'Cobalt glass ring with folded coral textile',keep:'Directional soft light, coral + cobalt palette, quiet negative space',results:[],selected:0,preferred:null,pending:null,undo:null,save:null,guard:false,failNext:false,busy:false,notice:'',history:[],model:'FLUX.2 [dev]',ratio:'4:5',quality:'Standard',detail:'Balanced',pane:'conversation'};
let timer;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,act,cls='')=>`<button data-act="${act}" class="${cls}">${text}</button>`;
const current=()=>state.results[state.selected];const prompt=()=>`${state.detail} editorial still life of ${state.subject.toLowerCase()}. Preserve ${state.keep.toLowerCase()}.`;
function tell(text){state.notice=text;$('#wa-notice').textContent=text;$('#wa-notice').hidden=false}
function add(who,text){state.history.push({who,text});if(state.history.length>6)state.history.shift()}
function setPane(pane){state.pane=pane;root.dataset.pane=pane;root.querySelectorAll('.wa-mobiletabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.act===(pane==='canvas'?'pane-canvas':'pane-chat'))))}
function reset(empty=false){clearTimeout(timer);Object.assign(state,{phase:empty?'empty':'ready',view:'reference',panel:'evidence',version:1,subject:'Cobalt glass ring with folded coral textile',keep:'Directional soft light, coral + cobalt palette, quiet negative space',results:[],selected:0,preferred:null,pending:null,undo:null,save:null,guard:false,failNext:false,busy:false,history:[]});$('#wa-input').value='';$('#wa-save-status').textContent='Demo draft';$('#wa-notice').hidden=true;setPane('conversation');render()}
function photo(src,label){return `<div class="wa-photo"><img src="${src}" alt="${esc(label)}"/><span class="wa-imglabel">${esc(label)}</span></div>`}
function agent(html){return `<article class="wa-agent"><div class="wa-author">VISORYN</div>${html}</article>`}
function render(){
$('#wa-title').textContent=state.phase==='empty'?'Untitled direction':'Studio objects';$('#wa-draft-version').textContent=`Draft ${state.version}`;
$('#wa-readiness').textContent=state.busy?(state.phase==='analyzing'?'Analyzing sample reference':'Generating from submitted snapshot'):state.phase==='empty'?'Add a reference to begin':state.pending?'Review the proposed change':!state.subject.trim()?'Add a subject in Draft':'Ready for 1 image';
$('#wa-context').textContent=state.view==='compare'?'Discussing reference + selected result':'Using reference + current draft';
syncActions();
let log='';
if(state.phase==='empty')log=agent(`<h3>Start with a reference.</h3><p class="wa-muted">Tell me what to keep, and what to change. We’ll turn your reference into a new direction.</p><div>${btn('Use sample reference','sample','wa-primary')}</div><p class="wa-note">This prototype uses the project’s studio still-life sample. File upload is available in the live product.</p>`);
else{
log='<div class="wa-user">Keep this visual style. Replace the vase with a cobalt glass ring and coral textile.</div>';
if(state.phase==='analyzing')log+=agent('<div class="wa-pulse wa-gap"><strong>Reading the reference</strong><span class="wa-note">Simulating evidence extraction…</span><div class="wa-progress"></div></div>');
else{log+=agent(`<p>The direction is set: preserve the light, color relationship and negative space, while changing the objects.</p><button class="wa-evidence" data-act="evidence">3 sample observations → View evidence</button>`);
state.history.forEach(m=>{log+=m.who==='user'?`<div class="wa-user">${esc(m.text)}</div>`:agent(`<p>${esc(m.text)}</p>`)});
if(state.guard)log+=agent(`<div class="wa-proposal"><h3>Start a new direction?</h3><p>The demo draft and results in this direction will be cleared.</p><div class="wa-row">${btn('Keep working','cancel-new')}${btn('Start new direction','confirm-new','wa-primary')}</div></div>`);
else if(state.save)log+=agent(`<div class="wa-proposal"><h3>${state.save==='result'?'Save this style':'Save draft as Style Memory'}</h3><label>Name<input id="wa-memory-name" value="Studio objects" /></label><p class="wa-note">${state.save==='result'?`Representative: Result ${state.selected+1}. Saving a preferred image alone does not verify the style.`:'No representative image. This will remain pending verification.'}</p>${state.save==='result'?'<label class="wa-check"><input type="checkbox" id="wa-verify"/><span>I confirm this result represents the style I want to reuse.</span></label>':''}<div class="wa-row">${btn('Cancel','cancel-save')}${btn('Save Style Memory','confirm-save','wa-primary')}</div></div>`);
else if(state.pending)log+=agent(`<div class="wa-proposal"><h3>Proposed change</h3><div class="wa-pair"><strong>Keep</strong><span>${esc(state.subject)}</span></div><div class="wa-pair"><strong>Before</strong><span>${esc(state.keep)}</span></div><div class="wa-pair"><strong>After</strong><span>${esc(state.pending)}</span></div><p class="wa-note">Applies to the next draft. Existing results stay unchanged.</p><div class="wa-row">${btn('Discard','discard')}${btn('Apply change','apply','wa-primary')}</div></div>`);
else if(state.phase==='generating')log+=agent(`<div class="wa-pulse wa-gap"><strong>Generating 1 image</strong><p class="wa-note">Submitted draft ${state.submitted.version}. You can prepare your next request.</p><div class="wa-progress"></div></div>`);
else if(state.phase==='failed')log+=agent(`<div class="wa-proposal"><h3 class="wa-error">Generation failed</h3><p>Your reference, draft and settings are preserved.</p><div class="wa-row">${btn('Retry generation','retry','wa-primary')}${btn('Edit draft','draft')}</div><p class="wa-note">Prototype failure. No live request was made.</p></div>`);
else if(state.phase==='result')log+=agent(`<p>Result ${state.selected+1} is ready to review. Compare the light and composition with your reference, then tell me what to adjust.</p><div class="wa-row">${btn('Compare with reference','compare','wa-primary')}${btn('Softer light','soften')}${btn('More negative space','space')}</div><p class="wa-note">Demo result uses a fixed project image; no visual match score is inferred.</p>`);
else log+=agent(`<div class="wa-proposal"><div class="wa-row wa-between"><h3>Next image</h3><span class="wa-tag">Draft ${state.version}</span></div><div class="wa-pair"><strong>Keep</strong><span>${esc(state.keep)}</span></div><div class="wa-pair"><strong>Change</strong><span>${esc(state.subject)}</span></div><div class="wa-row">${btn('Edit draft','draft')}${btn('Softer light','soften')}</div></div>`);
if(state.undo&&!state.pending)log+=`<div class="wa-row wa-note">Draft updated. ${btn('Undo','undo','wa-quiet')}</div>`;
}}
$('#wa-log').innerHTML=log;
root.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.view===state.view));b.disabled=b.dataset.view!=='reference'&&!state.results.length});
$('#wa-view-label').textContent=state.view==='reference'?'Original reference':state.view==='compare'?`Reference / Result ${state.selected+1}`:`Viewing result ${state.selected+1}`;
if(state.phase==='empty')$('#wa-media').innerHTML='<div class="wa-photo"><div class="wa-empty"><h3>Your next direction starts here.</h3><p class="wa-muted">Reference, evidence and results stay in view as the conversation moves forward.</p></div></div>';
else if(state.view==='compare'&&state.results.length)$('#wa-media').innerHTML=`<div class="wa-compare">${photo(ref,'Reference')}${photo(result,`Result ${state.selected+1} · Demo`)}</div>`;
else $('#wa-media').innerHTML=photo(state.view==='reference'?ref:result,state.view==='reference'?'Reference · Sample media':`Result ${state.selected+1} · Demo`);
$('#wa-result-actions').innerHTML=state.results.length?`<div class="wa-row">${btn(state.preferred===state.selected?'Preferred':'Set as preferred','preferred')}${btn('Save style','save-result')}</div>${btn('Continue from result','continue','wa-quiet')}`:'';
$('#wa-film').innerHTML=state.results.length?`<span class="wa-note">This direction</span>${state.results.slice(-5).map((r,j)=>{const i=state.results.length-Math.min(5,state.results.length)+j;return `<button class="wa-thumb" data-result="${i}" aria-pressed="${i===state.selected}"><img src="${result}" alt="Sample result ${i+1}"/><span>${state.preferred===i?'★ ':''}v${i+1}</span></button>`}).join('')}<span class="wa-note">Editing draft ${state.version}</span>`:'';
root.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===state.panel)));$('#wa-panel-label').textContent=state.panel==='evidence'?'From sample reference':`Current draft ${state.version}`;
let inspect='';
if(state.phase==='empty'||state.phase==='analyzing')inspect='<p class="wa-note">Evidence appears here after analysis.</p>';
else if(state.panel==='evidence')inspect=`<div class="wa-fact"><div class="wa-facthead"><strong>Color relationship</strong><span class="wa-note">Sample observation</span></div><p>Coral glass and cobalt paper against a quiet neutral ground.</p></div><div class="wa-fact"><strong>Directional light</strong><p>Soft-edged shadows give the objects volume.</p><button class="wa-evidence" data-act="soften">Discuss this light →</button></div><div class="wa-fact"><strong>Negative space</strong><p>Open space above the objects keeps the composition calm.</p><button class="wa-evidence" data-act="space">Adjust this rule →</button></div><p class="wa-note">Illustrative observations, not a live analysis. No confidence or image coordinates are supplied.</p>`;
else if(state.panel==='draft')inspect=`<div class="wa-gap"><label>Subject and scene<input id="wa-subject" value="${esc(state.subject)}"/></label><label>Style to preserve<textarea id="wa-keep">${esc(state.keep)}</textarea></label><div class="wa-row">${btn('Apply draft edits','edit-draft','wa-primary')}<span class="wa-note">Changes affect the next image.</span></div></div>`;
else inspect=`<div class="wa-gap"><label>Prompt detail<select id="wa-detail">${['Concise','Balanced','Detailed'].map(d=>`<option ${d===state.detail?'selected':''}>${d}</option>`).join('')}</select></label><pre>${esc(prompt())}</pre><p class="wa-note">Derived from the current demo draft. Full-text merge and provenance highlighting are specified in the design document.</p></div>`;
$('#wa-inspector').innerHTML=inspect;syncSettings();
}
function syncSettings(){syncActions()}
function syncActions(){const hasText=!!$('#wa-input').value.trim();$('#wa-send').textContent='Send';$('#wa-send').disabled=state.busy||!hasText;$('#wa-generate').textContent=state.busy?'Working…':'Generate 1 image';$('#wa-generate').disabled=state.busy||state.phase==='empty'||!!state.pending||hasText; if(hasText&&!state.busy)$('#wa-readiness').textContent='Send or clear your message before generating.';else if(!state.busy)$('#wa-readiness').textContent=state.phase==='empty'?'Add a reference to begin':state.pending?'Review the proposed change':'Ready for 1 image';}
function generate(){if(state.busy||state.phase==='empty')return;if(state.pending){tell('Apply or discard the proposed change before generating.');return}if(!state.subject.trim()){state.panel='draft';setPane('canvas');render();tell('Add a subject before generating.');return}state.submitted={subject:state.subject,keep:state.keep,version:state.version,model:state.model,ratio:state.ratio,quality:state.quality};state.busy=true;state.phase='generating';state.save=null;add('agent',`Submitted draft ${state.version}: ${state.model}, ${state.ratio}, ${state.quality}, 1 image.`);render();timer=setTimeout(()=>{state.busy=false;if(state.failNext){state.phase='failed';state.failNext=false;render();tell('Demo generation failed. Your draft is preserved.');return}state.results.push({...state.submitted});state.selected=state.results.length-1;state.view='result';state.phase='result';render();tell(`Demo result ${state.results.length} is available in Canvas.`)},1300)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();return}if(b.dataset.panel){state.panel=b.dataset.panel;render();return}if(b.dataset.result!==undefined){state.selected=Number(b.dataset.result);state.view='result';state.phase='result';render();tell(`Viewing result ${state.selected+1}. Draft ${state.version} is unchanged.`);return}
switch(b.dataset.act){
case 'pane-chat':setPane('conversation');break;case 'pane-canvas':setPane('canvas');break;
case 'new':if(state.phase==='empty')return;state.guard=true;state.save=null;setPane('conversation');render();break;
case 'cancel-new':state.guard=false;render();break;case 'confirm-new':reset(true);$('#wa-scenario').value='empty';break;
case 'sample':state.phase='analyzing';state.busy=true;render();timer=setTimeout(()=>{state.phase='ready';state.busy=false;render();tell('Sample analysis complete. Review the draft or generate one demo image.')},1000);break;
case 'attach':tell('This offline prototype uses the sample reference. Real file upload is defined in the interaction design.');break;
case 'generate':generate();break;
case 'send':{const text=$('#wa-input').value.trim();if(!text)break;add('user',text);$('#wa-input').value='';if(state.phase==='empty')tell('Add a reference first. Use the sample to continue this prototype.');else{add('agent','Your request is preserved. This prototype demonstrates lighting and composition changes through the actions below; free-form interpretation requires the live Agent.');state.phase=state.results.length?'result':'ready'}render();break}
case 'evidence':state.panel='evidence';state.view='reference';setPane('canvas');render();tell('Showing sample evidence next to the reference.');break;
case 'draft':state.panel='draft';setPane('canvas');render();break;
case 'soften':state.pending='Softer directional light, coral + cobalt palette, quiet negative space';add('user','Make the light softer, keeping the color relationship.');setPane('conversation');render();break;
case 'space':state.pending='Directional soft light, coral + cobalt palette, more negative space above the subject';add('user','Give the objects more negative space above.');setPane('conversation');render();break;
case 'apply':if(!state.pending)break;state.undo={subject:state.subject,keep:state.keep};state.keep=state.pending;state.pending=null;state.version++;state.phase='ready';state.panel='draft';add('agent','Change applied to the next draft. Existing results are unchanged.');render();tell('Draft updated. Generate when you are ready.');break;
case 'discard':state.pending=null;render();tell('Proposal discarded. Current draft is unchanged.');break;
case 'undo':if(!state.undo)break;state.subject=state.undo.subject;state.keep=state.undo.keep;state.undo=null;state.version++;render();tell('Last draft change undone.');break;
case 'edit-draft':{const subject=$('#wa-subject').value.trim();if(!subject){tell('Subject cannot be empty.');break}state.undo={subject:state.subject,keep:state.keep};state.subject=subject;state.keep=$('#wa-keep').value;state.version++;state.pending=null;state.phase='ready';render();tell('Direct edits applied to the next draft.');break}
case 'compare':state.view='compare';setPane('canvas');render();break;
case 'preferred':state.preferred=state.selected;render();tell(`Result ${state.selected+1} set as preferred. It is not yet a verified Style Memory.`);break;
case 'continue':if(!current())break;state.undo={subject:state.subject,keep:state.keep};state.subject=current().subject;state.keep=current().keep;state.version++;state.phase='ready';state.panel='draft';state.pending=null;render();tell('Created a new draft from the selected result. All results are preserved.');break;
case 'save-draft':if(state.phase==='empty'){tell('Create a draft before saving.');break}state.save='draft';state.guard=false;setPane('conversation');render();break;
case 'save-result':state.save='result';state.guard=false;setPane('conversation');render();break;
case 'cancel-save':state.save=null;render();break;
case 'confirm-save':if(!$('#wa-memory-name').value.trim()){tell('Enter a name for this Style Memory.');break}if(state.save==='result'&&!$('#wa-verify').checked){tell('Confirm that the representative result expresses the style before marking it verified.');break}const isResult=state.save==='result';state.save=null;render();$('#wa-save-status').textContent='Demo save completed';tell(isResult?'Demo: Style Memory saved with your representative confirmation. No live data was written.':'Demo: Style Memory draft saved as pending verification. No live data was written.');break;
case 'retry':generate();break;
}});
$('#wa-input').addEventListener('input',syncActions);
$('#wa-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&root.clientWidth>=768){e.preventDefault();if(!state.busy)$('#wa-send').click()}});
['model','ratio','quality'].forEach(k=>$('#wa-'+k).addEventListener('change',e=>{state[k]=e.target.value;state.version++;state.undo=null;syncSettings();$('#wa-draft-version').textContent=`Draft ${state.version}`;tell('Settings updated for the next image. Any running submission is unchanged.')}));
root.addEventListener('change',e=>{if(e.target.id==='wa-detail'){state.detail=e.target.value;state.version++;state.undo=null;render()}});
$('#wa-scenario').addEventListener('change',e=>{const choice=e.target.value;reset(choice==='empty');if(choice==='failed'){state.phase='failed';render();tell('Failure scenario: retry preserves the current draft.')}});
render();
if(globalThis.Tweak){const style={conversationWidth:42,theme:'System'};const tweak=new Tweak({container:root,onChange:()=>{$('.wa-layout').style.gridTemplateColumns=`minmax(330px,${style.conversationWidth}%) minmax(0,1fr)`;root.style.colorScheme=style.theme==='System'?'light dark':style.theme.toLowerCase()}});tweak.addSlider(style,'conversationWidth',{label:'Conversation width',min:36,max:50,unit:'%'});tweak.addSelect(style,'theme',{label:'Appearance',options:['System','Light','Dark']})}
})();
</script>
