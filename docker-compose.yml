services:
  db:
    image: postgres:17-alpine
    container_name: style-gen-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: style_gen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d style_gen"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
